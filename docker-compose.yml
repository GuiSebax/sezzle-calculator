services:
  backend:
    build: ./backend
    environment:
      PORT: "8080"
      # The UI calls the API through the nginx proxy (same origin), so CORS is
      # only exercised by direct calls; allow the frontend origin anyway.
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      - backend
    restart: unless-stopped
